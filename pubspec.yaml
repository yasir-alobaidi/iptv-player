name: iptv_player
description: Personal IPTV player for Linux and Windows, with casting, downloads, and a local library.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.4"

# Versions: docs/decisions.md ADR-002 (flutter_svg: ADR-008).
dependencies:
  bonsoir: ^7.1.5
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  drift: ^2.35.0
  extended_image: ^10.1.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  logger: ^2.8.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  protobuf: ^6.1.0
  riverpod_annotation: ^4.0.7
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^3.6.0
  watcher: ^1.2.1
  win32: ^6.4.0
  window_manager: ^0.5.2
  xdg_directories: ^1.1.0
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.16.1
  # tools/extract_icons.dart identifies canvas icons by an md5 of their markup.
  crypto: ^3.0.6
  drift_dev: ^2.35.0
  # Tests start the fake Xtream panel in-process on a free port (docs/06).
  fake_provider:
    path: tools/fake_provider
  # `flutter drive --profile` for the frame-time measurement (docs/06).
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

# Our patched media_kit_video (media_kit #1404), rebuilt by tools/vendor_media_kit_video.sh (ADR-003).
dependency_overrides:
  media_kit_video:
    path: third_party/media_kit_video

flutter:
  uses-material-design: true

  assets:
    # Canvas icons, regenerated by tools/extract_icons.dart.
    - assets/icons/
    # Bundled font licences, added to LicenseRegistry at startup.
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Variable fonts (wght axis). Weights are selected with FontVariation('wght')
  # alongside FontWeight; see lib/design/tokens.dart.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf

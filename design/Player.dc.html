<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #000000; font-family: Manrope, "Segoe UI", system-ui, sans-serif; color: #F3F5F9; font-variant-numeric: tabular-nums; }
    a { color: #5B8CFF; } a:hover { color: #86A9FF; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: radial-gradient(18% 20% at 10% 4%, rgba(255,250,230,0.55), rgba(255,250,230,0) 70%), radial-gradient(18% 20% at 90% 4%, rgba(255,250,230,0.5), rgba(255,250,230,0) 70%), radial-gradient(75% 60% at 50% 72%, #2F7A5A 0%, #1B5040 42%, #0A1A16 82%);">
  <div style="position: absolute; left: 14%; right: 14%; bottom: 14%; height: 42%; border: 3px solid rgba(255,255,255,0.16); border-radius: 6px; transform: perspective(700px) rotateX(42deg);"></div>
  <div style="position: absolute; left: 50%; bottom: 14%; width: 3px; height: 42%; background: rgba(255,255,255,0.14); transform: perspective(700px) rotateX(42deg);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 180px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 55%, rgba(0,0,0,0) 100%);"></div>

  <div style="position: absolute; top: 32px; left: 40px; right: 40px; display: flex; align-items: center; gap: 16px;">
    <div style="width: 52px; height: 52px; border-radius: 12px; background: #2B4C8C; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #FFFFFF;">AS</div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 15px; font-weight: 700; color: #A7AFBD;">201</span>
        <span style="font-size: 20px; font-weight: 800;">Arena Sports 1</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 3px 8px; border-radius: 6px; background: #FF4D5E; color: #FFFFFF;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF;"></span>LIVE</span>
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.14); color: #F3F5F9;">1080p · 50 fps</span>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 22px; font-weight: 700; color: #F3F5F9;">9:22 PM</span>
  </div>

  <div style="position: absolute; left: 40px; right: 40px; bottom: 36px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 34px; line-height: 42px; font-weight: 800; letter-spacing: -0.4px;">Continental Cup · Semi-final</div>
      <div style="display: flex; align-items: center; gap: 16px; font-size: 15px; color: #C9D0DC;">
        <span>8:00 PM</span>
        <div style="flex-grow: 1; height: 5px; border-radius: 5px; background: rgba(255,255,255,0.18);"><div style="width: 62%; height: 5px; border-radius: 5px; background: #5B8CFF;"></div></div>
        <span>10:00 PM</span>
      </div>
      <div style="font-size: 14px; color: #A7AFBD;"><span style="font-weight: 800; letter-spacing: 0.6px; font-size: 12px; color: #6C7485;">NEXT</span>  10:00 PM · Match of the Week: Extended Highlights</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,0.08);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <div style="width: 110px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.2);"><div style="width: 70%; height: 4px; border-radius: 4px; background: #F3F5F9;"></div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 14px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        <span>English · AAC 2.0</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,0.16); font-size: 14px; font-weight: 700; box-shadow: 0 0 0 2px #5B8CFF, 0 0 0 6px rgba(91,140,255,0.3);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M13 15h4M7 11h2M11 11h6"/></svg>
        <span>Subtitles off</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 14px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M17 10v4"/></svg>
        <span>Fit</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <div title="Channels" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 600; color: #C9D0DC;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.25);">↑↓</span><span>Change channel</span>
      </div>
      <div title="Stream info" style="width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </div>
      <div title="Cast" style="width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M3 12a8 8 0 0 1 8 8M3 16a4 4 0 0 1 4 4"/></svg>
      </div>
      <div title="Exit fullscreen" style="width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </div>
    </div>
  </div>

  <div style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(17,20,26,0.85); border: 1px solid #2A3040; font-size: 13px; font-weight: 600; color: #C9D0DC;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/></svg>
    <span>Reconnecting… attempt 2 of 6</span>
  </div>
</div>
</x-dc>
</body>
</html>

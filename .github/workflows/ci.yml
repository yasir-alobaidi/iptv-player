# CI for the IPTV player (docs/06-quality.md, docs/plans/phase-1-foundation.md
# step 8). Every push and pull request: generated code is up to date, the
# analyzer and formatter are clean, the tests pass on both desktop targets,
# and release bundles build and are kept as artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes a run that is still going for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: the Phase 0 GO (ADR-007) and the goldens were both recorded on
  # this version. Bump it deliberately, and re-record the goldens if text
  # rasterization moves.
  FLUTTER_VERSION: 3.47.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One target failing should still tell us about the other.
      fail-fast: false
      matrix:
        include:
          # 22.04 matches the development laptop and the AppImage target
          # (libmpv 0.34.1). If GitHub retires the image, moving to 24.04
          # also changes the mpv the app is tested against — see ADR-003.
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      # Before checkout: Windows would otherwise check out CRLF and every
      # generated file would look modified to the build_runner diff check.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libmpv-dev libmimalloc-dev \
            xvfb
        # libsecret/jsoncpp: flutter_secure_storage. libmpv/mimalloc:
        # media_kit. xvfb: the integration test. No VA-API drivers, no
        # avahi and no protoc — CI builds and tests, it does not play or
        # cast (docs/setup.md).

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter pub get
          dart pub get --directory=tools/fake_provider
        # The fake provider is its own package, and the root `flutter
        # analyze` reaches into it: without this every import in it is
        # unresolved and the analyze step fails.

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
        # freezed / drift / riverpod / json output is committed, so a
        # diff here means someone changed a model without regenerating.

      - name: Analyze
        run: flutter analyze

      - name: Format
        run: dart format --set-exit-if-changed lib test integration_test tools
        # Not `.`: third_party/ is vendored upstream code and is not
        # formatted to our settings (docs/06).

      - name: Test (Linux, including goldens)
        if: runner.os == 'Linux'
        run: flutter test

      - name: Test (Windows, goldens excluded)
        if: runner.os == 'Windows'
        run: flutter test --exclude-tags golden
        # Goldens are recorded on Linux only: text rasterizes differently
        # here, so the same widget is a different image (ADR-008).

      - name: Fake provider tests
        run: dart test
        working-directory: tools/fake_provider
        # The tests that need ffmpeg and the generated media samples skip
        # themselves with a reason: neither is committed.

      - name: Integration tests under xvfb
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        # One file per run: on Linux desktop the second app of a
        # multi-file run never starts ("Unable to start the app on the
        # device"), whichever file it is.
        run: |
          for test in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$test" -d linux
          done

      - name: Build release bundle (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build release bundle (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-linux-x64
          path: build/linux/x64/release/bundle
          if-no-files-found: error

      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error

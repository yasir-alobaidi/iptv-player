# Tags used by `flutter test`. Declaring them here keeps the runner from
# warning about an unknown tag and documents what each one selects.
tags:
  golden:
    description: >-
      Golden image tests. Linux only: text rasterizes differently on
      Windows, so the reference images are recorded and checked on Linux
      (ADR-008). CI runs `flutter test --exclude-tags golden` on Windows.
  benchmark:
    description: >-
      Timing and UI-isolate jank measurements. Skipped by default: timings
      on shared CI runners are noise, and docs/06's frame budget is
      measured by hand (Phase 2 decision 4). Run with
      `flutter test --tags benchmark --run-skipped` and record the numbers
      in docs/progress.md.
    skip: "a benchmark: run with --tags benchmark --run-skipped"
  real_provider:
    description: >-
      Talks to the user's own panel (the login file outside the repository,
      docs/06). Skipped by default, and never run without the user's
      go-ahead: run with `flutter test --tags real_provider --run-skipped`.
    skip: "talks to a real panel: run with --tags real_provider --run-skipped"
  real_network:
    description: >-
      Listens for Cast devices on this computer's own network (mDNS and a
      direct DNS-SD query: nothing shows on any screen). Skipped by
      default: CI has no devices. Run with
      `flutter test --tags real_network --run-skipped`.
    skip: "listens on the real network: run with --tags real_network --run-skipped"
  real_cast:
    description: >-
      Casts to a real Cast device on this computer's network (the user's
      Living Room TV): it shows on that TV's screen. Skipped by default, and
      never run without the user's go-ahead (they watch it): run with
      `CAST_HOST=<address> flutter test --tags real_cast --run-skipped`.
    skip: "casts to a real TV: run with --tags real_cast --run-skipped, with the user's go-ahead"
